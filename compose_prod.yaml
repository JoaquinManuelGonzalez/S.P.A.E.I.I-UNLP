version: "3.9"

services:
  # Python Application (Flask + Gunicorn)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spaeii_python
    environment:
      - FLASK_ENV=$ENVIRONMENT
      - DB_PASSWORD=$DB_PASSWORD
      - MINIO_PASSWORD=$MINIO_PASSWORD
      - MINIO_SECRET_KEY=$MINIO_SECRET_KEY
      - MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
      - MINIO_BUCKET=$MINIO_BUCKET
      - MAIL_USERNAME=ingsoftaplicadag5@gmail.com
      - MAIL_PASSWORD=gpho lqxf muzd hkyw
    depends_on:
      - db
      - minio
    networks:
      - db-network
    ports:
      - "5000:5000"   # expuesto en la VM
    restart: unless-stopped

  # Vue Frontend + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spaeii_vue
    ports:
      - "8080:80"     # Vue accesible en IP_VM:8080
    environment:
      - NODE_ENV=$ENVIRONMENT
    networks:
      - db-network
    depends_on:
      - app
    restart: unless-stopped

  # MySQL Database (interno)
  db:
    image: mysql:5.7
    container_name: spaeii_mysql_db
    networks:
      - db-network
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: $ROOT_PASSWORD
      MYSQL_DATABASE: 'SPAEIIDatabase'
      MYSQL_USER: 'admin'
      MYSQL_PASSWORD: $DB_PASSWORD
    restart: unless-stopped
    # no expone puertos al host

  # MinIO (interno, salvo que quieras la consola)
  minio:
    image: quay.io/minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: spaeii_minio
    networks:
      - db-network
    environment:
      MINIO_ROOT_USER: 'admin'
      MINIO_ROOT_PASSWORD: $MINIO_PASSWORD
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"     # MinIO port for S3 API access
      - "9001:9001"     # MinIO console port
    volumes:
      - minio-data:/data
    # no expone puertos al host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

networks:
  db-network:

volumes:
  minio-data:
  db-data:
